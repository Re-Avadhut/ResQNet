<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">
    <meta name="description" content="ResQNet - Disaster Operating Platform">
    <link rel="manifest" href="/manifest.json">
    <title>ResQNet</title>
    <!-- TODO(offline): Tailwind + Leaflet load from a CDN, so the PWA is not
         truly offline-capable yet. Both must be vendored into frontend/vendor/. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // Shade scales are required: Tailwind only generates
                        // classes for keys that exist, so a flat value would
                        // make bg-emergency-600 a no-op class.
                        emergency: { 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' },
                        rescue:    { 500: '#10b981', 600: '#059669', 700: '#047857' },
                        warning:   { 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
                        info:      { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-gray-50 text-gray-900">
    <header class="bg-emergency-600 text-white p-4 shadow-md">
        <h1 class="text-2xl font-bold">ResQNet</h1>
        <p class="text-sm">Disaster Operating Platform</p>
    </header>
    
    <nav class="bg-white border-b border-gray-200 p-4 flex gap-4">
        <a href="javascript:void(0)" onclick="loadPage('dashboard')" class="text-blue-600 hover:text-blue-800 font-medium">Dashboard</a>
        <a href="javascript:void(0)" onclick="loadPage('sos')" class="text-gray-600 hover:text-gray-800 font-medium">SOS</a>
        <a href="javascript:void(0)" onclick="loadPage('missing-persons')" class="text-gray-600 hover:text-gray-800 font-medium">Missing Persons</a>
        <a href="javascript:void(0)" onclick="loadPage('volunteer')" class="text-gray-600 hover:text-gray-800 font-medium">Volunteers</a>
        <a href="javascript:void(0)" onclick="loadPage('map')" class="text-gray-600 hover:text-gray-800 font-medium">Map</a>
    </nav>
    
    <main id="app-content" class="p-4">
        <!-- Dynamic content will be loaded here -->
        <div id="welcome-message" class="text-center py-8">
            <h2 class="text-xl font-semibold mb-4">Welcome to ResQNet</h2>
            <p class="text-gray-600">Select a section above to begin.</p>
        </div>
    </main>
    
    <footer class="bg-gray-100 p-4 text-center text-gray-600 text-sm">
        <p>ResQNet - Offline Emergency Communication System</p>
    </footer>
    
    <script src="/js/app.js"></script>
</body>
</html>
